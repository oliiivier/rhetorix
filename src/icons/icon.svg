<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e222a"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi sombre -->
  <rect width="128" height="128" rx="26" ry="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="25" ry="25" fill="none" stroke="#2e3440" stroke-width="2"/>

  <!-- Trois barres de surlignage représentant Sophisme, Biais, Allégation -->
