<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Options Rhetorix</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <main>
      <h1 id="title">Rhetorix — options</h1>
      <form id="form">
        <label>
          <span id="lbl-provider">Fournisseur</span>
          <select name="provider">
            <option value="anthropic">Anthropic</option>
            <option value="openai-compatible">Compatible OpenAI (OpenAI, Mistral, OpenRouter, Ollama…)</option>
            <option value="gemini">Google Gemini</option>
            <option value="chrome-ai" id="opt-chrome-ai">Chrome Built-in AI (Gemini Nano local, sans clé)</option>
          </select>
        </label>

        <div id="chrome-ai-info" class="chrome-ai-info" hidden>
          <p id="chrome-ai-hint" class="hint"></p>
        </div>

        <label id="endpoint-field">
          <span id="lbl-endpoint">Endpoint</span>
          <input type="url" name="endpoint" placeholder="https://api.openai.com/v1" />
          <div class="key-actions">
            <button type="button" id="btn-preset-ollama" class="secondary-btn">🦙 Configurer pour Ollama local (zéro clé)</button>
          </div>
          <span class="hint" id="endpoint-hint">URL de base de l'API ; <code>/chat/completions</code> y est ajouté.</span>
          <span class="hint" id="endpoint-ollama-hint">Pour Ollama en local (ex. <code>http://localhost:11434/v1</code>), lancez le serveur avec <code>OLLAMA_ORIGINS="chrome-extension://*,moz-extension://*"</code> pour autoriser l'accès.</span>
        </label>

        <label id="api-key-field">
          <span id="lbl-api-key">Clé API</span>
          <input type="password" name="apiKey" id="input-api-key" autocomplete="off" />
          <span class="hint" id="api-key-hint">Stockée uniquement dans ce navigateur (stockage local, non synchronisé).</span>
          <div class="key-actions">
            <a id="btn-get-gemini-key" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="link-btn" hidden>
              ✨ Obtenir une clé Gemini gratuite (Google AI Studio) ↗
            </a>
            <a id="btn-get-anthropic-key" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer" class="link-btn" hidden>
              Obtenir une clé Anthropic ↗
            </a>
          </div>
        </label>

        <div id="model-field" class="field-block">
          <div class="field-header">
            <span id="lbl-model">Modèle</span>
            <div class="model-actions">
              <button type="button" id="btn-toggle-custom-model" class="secondary-btn small-btn">✍️ Saisie libre</button>
              <button type="button" id="btn-refresh-models" class="secondary-btn small-btn">🔄 Actualiser les modèles</button>
            </div>
          </div>
          <div class="model-select-wrapper">
            <select id="model-select"></select>
            <input type="text" name="model" id="input-model" autocomplete="off" hidden />
          </div>
          <span class="hint" id="model-hint">Sélectionnez un modèle dans la liste ou passez en saisie libre.</span>
          <span class="hint" id="models-status" role="status"></span>
        </div>

        <label>
          <span id="lbl-language">Langue de l'analyse</span>
          <select name="language">
            <option value="auto">Langue du navigateur</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
          </select>
        </label>

        <label>
          <span id="lbl-display-mode">Mode d'affichage</span>
          <select name="displayMode">
            <option value="both" id="opt-mode-both">Combiné (panneau et bulles)</option>
            <option value="inline" id="opt-mode-inline">Bulles au survol uniquement</option>
            <option value="sidepanel" id="opt-mode-sidepanel">Panneau latéral uniquement</option>
          </select>
          <span class="hint" id="display-mode-hint">Choisissez si les annotations s'affichent sous forme de bulles au survol du texte, dans le panneau latéral, ou les deux.</span>
        </label>

        <div id="websearch-field">
          <label class="checkbox">
            <input type="checkbox" name="webSearch" />
            <span id="lbl-web-search">Vérifier les faits par recherche web</span>
          </label>
          <span class="hint" id="websearch-hint"></span>
        </div>

        <label>
          <span id="lbl-max-chunk">Taille maximale d'un morceau (tokens)</span>
          <input type="number" name="maxChunkTokens" min="2000" step="1000" />
          <span class="hint" id="max-chunk-hint">Au-delà, l'article est découpé par paragraphes et analysé en plusieurs appels.</span>
        </label>

        <div class="row">
          <button id="btn-save" class="primary" type="submit">Enregistrer</button>
          <span id="form-status" role="status"></span>
        </div>
      </form>

      <section>
        <h2 id="heading-cache">Cache des analyses</h2>
        <div class="row">
          <button id="clear-cache" type="button">Vider le cache</button>
          <span id="cache-status" role="status"></span>
        </div>
      </section>

      <section>
        <h2 id="heading-privacy">Confidentialité</h2>
        <p id="privacy-text">
          Le texte des articles analysés est envoyé au fournisseur configuré ci-dessus, et à lui seul.
          Rhetorix ne dispose d'aucun serveur.
        </p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
