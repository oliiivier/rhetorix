<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Options Rhetorix</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <main>
      <h1 id="title">Rhetorix — options</h1>
      <form id="form">
        <label>
          <span id="lbl-provider">Fournisseur</span>
          <select name="provider">
            <option value="anthropic">Anthropic</option>
            <option value="openai-compatible">Compatible OpenAI (OpenAI, Mistral, OpenRouter, Ollama…)</option>
            <option value="gemini">Google Gemini</option>
          </select>
        </label>

        <label id="endpoint-field">
          <span id="lbl-endpoint">Endpoint</span>
          <input type="url" name="endpoint" placeholder="https://api.openai.com/v1" />
          <span class="hint" id="endpoint-hint">URL de base de l'API ; <code>/chat/completions</code> y est ajouté.</span>
          <span class="hint" id="endpoint-ollama-hint">Pour Ollama en local (ex. <code>http://localhost:11434/v1</code>), lancez le serveur avec <code>OLLAMA_ORIGINS="chrome-extension://*,moz-extension://*"</code> pour autoriser l'accès.</span>
        </label>

        <label>
          <span id="lbl-api-key">Clé API</span>
          <input type="password" name="apiKey" autocomplete="off" />
          <span class="hint" id="api-key-hint">Stockée uniquement dans ce navigateur (stockage local, non synchronisé).</span>
        </label>

        <label>
          <span id="lbl-model">Modèle</span>
          <input type="text" name="model" required />
        </label>

        <label>
          <span id="lbl-language">Langue de l'analyse</span>
          <select name="language">
            <option value="auto">Langue du navigateur</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
          </select>
        </label>

        <label class="checkbox">
          <input type="checkbox" name="webSearch" />
          <span id="lbl-web-search">Vérifier les faits par recherche web</span>
        </label>
        <span class="hint" id="websearch-hint"></span>

        <label>
          <span id="lbl-max-chunk">Taille maximale d'un morceau (tokens)</span>
          <input type="number" name="maxChunkTokens" min="2000" step="1000" />
          <span class="hint" id="max-chunk-hint">Au-delà, l'article est découpé par paragraphes et analysé en plusieurs appels.</span>
        </label>

        <div class="row">
          <button id="btn-save" class="primary" type="submit">Enregistrer</button>
          <span id="form-status" role="status"></span>
        </div>
      </form>

      <section>
        <h2 id="heading-cache">Cache des analyses</h2>
        <div class="row">
          <button id="clear-cache" type="button">Vider le cache</button>
          <span id="cache-status" role="status"></span>
        </div>
      </section>

      <section>
        <h2 id="heading-privacy">Confidentialité</h2>
        <p id="privacy-text">
          Le texte des articles analysés est envoyé au fournisseur configuré ci-dessus, et à lui seul.
          Rhetorix ne dispose d'aucun serveur.
        </p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
