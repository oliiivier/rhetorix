<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rhetorix</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="panel">
    <header class="toolbar">
      <h1>Rhetorix</h1>
      <div class="actions">
        <select id="display-mode" class="mode-select" aria-label="Mode d'affichage">
          <option value="both" id="opt-both">Combiné</option>
          <option value="inline" id="opt-inline">Bulles</option>
          <option value="sidepanel" id="opt-sidepanel">Panneau</option>
        </select>
        <button id="analyze" class="primary" type="button">Analyser la page</button>
        <button id="analyze-full" type="button" hidden>Analyser toute la vidéo</button>
        <button id="cancel" type="button" hidden>Annuler</button>
        <button id="options" class="icon" type="button" title="Options" aria-label="Options">⚙</button>
      </div>
    </header>

    <main>
      <p id="status" class="status" role="status" aria-live="polite">
        Ouvrez un article puis lancez l'analyse.
      </p>

      <section id="result" hidden>
        <p id="cache-note" class="note" hidden></p>
        <div id="inline-notice" class="note inline-notice" hidden>
          <span id="inline-notice-text"></span>
          <div class="inline-notice-actions">
            <button id="switch-both-btn" type="button" class="primary">Passer en mode bulles & panneau à la demande</button>
            <button id="close-sidebar-btn" type="button">Fermer le panneau</button>
          </div>
        </div>
        <div id="clickbait-banner" class="alert-box clickbait-box" hidden>
          <div class="alert-header">
            <span class="alert-icon">⚠️</span>
            <strong id="clickbait-heading">Décalage titre / contenu</strong>
          </div>
          <p id="clickbait-text" class="alert-text"></p>
        </div>
        <h2 id="summary-heading">Posture argumentative</h2>
        <p id="summary" class="summary"></p>
        <div id="blind-spot-card" class="alert-box blind-spot-box" hidden>
          <div class="alert-header">
            <span class="alert-icon">💡</span>
            <strong id="blind-spot-heading">Angle mort / Omission clé</strong>
          </div>
          <p id="blind-spot-text" class="alert-text"></p>
        </div>
        <div class="legend" id="filters" role="group" aria-label="Filtrer les annotations par catégorie">
          <button type="button" class="filter-btn active" data-category="all">Tous</button>
          <button type="button" class="filter-btn badge sophism" data-category="sophism">Sophisme</button>
          <button type="button" class="filter-btn badge bias" data-category="bias">Biais</button>
          <button type="button" class="filter-btn badge factual_claim" data-category="factual_claim">Allégation</button>
        </div>
        <ol id="cards" class="cards"></ol>
      </section>
    </main>

    <div id="token-bar" class="token-bar">
      <div class="token-bar-info">
        <span class="token-icon" aria-hidden="true">⚡</span>
        <span id="token-label" class="token-label">Tokens :</span>
        <span id="token-in" class="token-in"></span>
        <span id="token-dot" class="token-dot" hidden>·</span>
        <span id="token-out" class="token-out"></span>
        <span id="token-total" class="token-total"></span>
        <span id="token-cached" class="token-cached" hidden></span>
        <span id="token-idle" class="token-idle">—</span>
      </div>
      <button id="token-options-btn" class="token-options-btn" type="button" title="Consommation de tokens et quotas">📊</button>
    </div>

    <footer id="privacy-footer" class="privacy">Le texte de l'article est envoyé au fournisseur LLM configuré.</footer>

    <template id="card-template">
      <li class="card" tabindex="0">
        <div class="card-head">
          <span class="badge"></span>
          <span class="label"></span>
          <span class="time-badge" hidden></span>
          <span class="severity"></span>
        </div>
        <blockquote class="quote"></blockquote>
        <p class="unlocated" hidden>Citation introuvable dans la page.</p>
        <p class="critique"></p>
        <details class="fact-check">
          <summary><span class="fact-status"></span></summary>
          <p class="fact-context"></p>
          <ul class="sources"></ul>
        </details>
      </li>
    </template>

    <script src="sidepanel.js"></script>
  </body>
</html>
